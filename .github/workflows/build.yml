name: Build Signed IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Certificate and Key
        env:
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
        run: |
          mkdir -p $RUNNER_TEMP/certs_out

          openssl pkcs12 -in certs/cert.p12 -passin pass:"$P12_PASSWORD" -clcerts -nokeys -out $RUNNER_TEMP/certs_out/cert.pem -legacy 2>/dev/null || \
          openssl pkcs12 -in certs/cert.p12 -passin pass:"$P12_PASSWORD" -clcerts -nokeys -out $RUNNER_TEMP/certs_out/cert.pem

          openssl pkcs12 -in certs/cert.p12 -passin pass:"$P12_PASSWORD" -nocerts -nodes -out $RUNNER_TEMP/certs_out/key.pem -legacy 2>/dev/null || \
          openssl pkcs12 -in certs/cert.p12 -passin pass:"$P12_PASSWORD" -nocerts -nodes -out $RUNNER_TEMP/certs_out/key.pem

          KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain-db
          security create-keychain -p "actions" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "actions" "$KEYCHAIN_PATH"

          cat $RUNNER_TEMP/certs_out/cert.pem $RUNNER_TEMP/certs_out/key.pem > $RUNNER_TEMP/certs_out/combined.pem
          openssl pkcs12 -export -in $RUNNER_TEMP/certs_out/combined.pem -out $RUNNER_TEMP/certs_out/rebuilt.p12 -passout pass:actions
          
          security import $RUNNER_TEMP/certs_out/rebuilt.p12 -P actions -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "actions" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"

      - name: Build iOS Executable
        run: |
          SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
          
          swiftc -target arm64-apple-ios15.0 \
                 -sdk "$SDK_PATH" \
                 -parse-as-library \
                 Sources/App.swift \
                 -o BlackMarket

      - name: Package and Sign IPA
        run: |
          mkdir -p Payload/BlackMarket.app
          
          cp BlackMarket Payload/BlackMarket.app/BlackMarket
          cp Sources/Info.plist Payload/BlackMarket.app/Info.plist
          cp certs/profile.mobileprovision Payload/BlackMarket.app/embedded.mobileprovision
          
          if [ -f "Sources/AppIcon.png" ]; then
            sips -z 120 120 Sources/AppIcon.png --out Payload/BlackMarket.app/AppIcon60x60@2x.png
            sips -z 180 180 Sources/AppIcon.png --out Payload/BlackMarket.app/AppIcon60x60@3x.png
            sips -z 120 120 Sources/AppIcon.png --out Payload/BlackMarket.app/AppIcon60x60.png
          fi

          # 1. 프로비저닝 프로파일에서 entitlements 자동 추출
          security cms -D -i certs/profile.mobileprovision > $RUNNER_TEMP/provision.plist
          /usr/libexec/PlistBuddy -x -c 'Print :Entitlements' $RUNNER_TEMP/provision.plist > $RUNNER_TEMP/entitlements.plist

          # 2. 인증서 ID 추출
          CERT_ID=$(security find-identity -v -p codesigning $RUNNER_TEMP/build.keychain-db | head -n 1 | awk -F'"' '{print $2}')
          echo "Signing with: $CERT_ID"

          # 3. entitlements를 포함한 정식 코드 서명
          codesign --force --deep --sign "$CERT_ID" --entitlements $RUNNER_TEMP/entitlements.plist --timestamp=none Payload/BlackMarket.app
          
          zip -r BlackMarket-Signed.ipa Payload

      - name: Upload Signed IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BlackMarket-Signed-IPA
          path: BlackMarket-Signed.ipa
