name: Build Signed IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Apple Certificate and Provisioning Profile
        env:
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          KEYCHAIN_PASSWORD: "temporary-keychain-pass"
        run: |
          # 1. 임시 키체인 생성 및 잠금 해제
          KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain-db
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # 2. 레거시(OpenSSL Legacy) p12 호환 변환 처리
          openssl pkcs12 -in certs/cert.p12 -passin pass:"$P12_PASSWORD" -nodes -out $RUNNER_TEMP/temp_cert.pem -legacy 2>/dev/null || \
          openssl pkcs12 -in certs/cert.p12 -passin pass:"$P12_PASSWORD" -nodes -out $RUNNER_TEMP/temp_cert.pem

          # 3. macOS 호환 p12로 재포장 후 키체인에 임포트
          openssl pkcs12 -export -in $RUNNER_TEMP/temp_cert.pem -out $RUNNER_TEMP/converted_cert.p12 -passout pass:"$P12_PASSWORD" -keypbe NONE -certpbe NONE -nomac
          security import $RUNNER_TEMP/converted_cert.p12 -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH" -T /usr/bin/codesign
          
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"

      - name: Build iOS Executable
        run: |
          SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
          
          swiftc -target arm64-apple-ios15.0 \
                 -sdk "$SDK_PATH" \
                 -parse-as-library \
                 Sources/App.swift \
                 -o BlackMarket

      - name: Package and Sign IPA
        run: |
          mkdir -p Payload/BlackMarket.app
          
          # 1. 바이너리, Info.plist, 프로비저닝 프로파일 복사
          cp BlackMarket Payload/BlackMarket.app/BlackMarket
          cp Sources/Info.plist Payload/BlackMarket.app/Info.plist
          cp certs/profile.mobileprovision Payload/BlackMarket.app/embedded.mobileprovision
          
          # 2. 아이콘 리사이징
          if [ -f "Sources/AppIcon.png" ]; then
            sips -z 120 120 Sources/AppIcon.png --out Payload/BlackMarket.app/AppIcon60x60@2x.png
            sips -z 180 180 Sources/AppIcon.png --out Payload/BlackMarket.app/AppIcon60x60@3x.png
            sips -z 120 120 Sources/AppIcon.png --out Payload/BlackMarket.app/AppIcon60x60.png
          fi

          # 3. 키체인에서 인증서 ID(Common Name) 추출
          CERT_ID=$(security find-identity -v -p codesigning $RUNNER_TEMP/build.keychain-db | head -n 1 | awk -F'"' '{print $2}')
          echo "Using certificate: $CERT_ID"

          # 4. 정식 코드 서명
          codesign --force --deep --sign "$CERT_ID" --timestamp=none Payload/BlackMarket.app
          
          # 5. 서명된 IPA 압축
          zip -r BlackMarket-Signed.ipa Payload

      - name: Upload Signed IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BlackMarket-Signed-IPA
          path: BlackMarket-Signed.ipa
