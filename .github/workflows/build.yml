name: Build Unsigned IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build iOS Executable
        run: |
          SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
          
          swiftc -target arm64-apple-ios15.0 \
                 -sdk "$SDK_PATH" \
                 -parse-as-library \
                 Sources/App.swift \
                 -o BlackMarket

      - name: Package Payload and IPA
        run: |
          mkdir -p Payload/BlackMarket.app
          
          # 1. 실행 바이너리 및 Info.plist 복사
          cp BlackMarket Payload/BlackMarket.app/BlackMarket
          cp Sources/Info.plist Payload/BlackMarket.app/Info.plist
          
          # 2. 업로드된 이미지를 기반으로 규격별 iOS 아이콘 생성
          if [ -f "Sources/AppIcon.png" ]; then
            sips -z 120 120 Sources/AppIcon.png --out Payload/BlackMarket.app/AppIcon60x60@2x.png
            sips -z 180 180 Sources/AppIcon.png --out Payload/BlackMarket.app/AppIcon60x60@3x.png
            sips -z 120 120 Sources/AppIcon.png --out Payload/BlackMarket.app/AppIcon60x60.png
          fi
          
          # 3. 임시 서명 (codesign)
          codesign --force --deep --sign - Payload/BlackMarket.app
          
          # 4. IPA 압축 생성
          zip -r BlackMarket.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BlackMarket-Unsigned-IPA
          path: BlackMarket.ipa
