name: Build Unsigned IPA

on:
  workflow_dispatch: # Actions 탭에서 수동 실행

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build iOS Executable
        run: |
          swift build -c release --triple arm64-apple-ios15.0

      - name: Package Payload and IPA
        run: |
          mkdir -p Payload/BlackMarket.app
          cp .build/arm64-apple-ios15.0/release/BlackMarket Payload/BlackMarket.app/BlackMarket
          cp Sources/Info.plist Payload/BlackMarket.app/Info.plist
          zip -r BlackMarket.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BlackMarket-Unsigned-IPA
          path: BlackMarket.ipa
