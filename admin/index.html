<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Black Market - Mail & Device Admin</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace; }
        body { background: #08080a; color: #fff; min-height: 100vh; padding: 30px 20px; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 900px; display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
        @media (max-width: 800px) { .container { grid-template-columns: 1fr; } }
        
        .glass-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border-radius: 20px;
            padding: 26px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
            height: fit-content;
        }
        h2 { font-size: 18px; font-weight: 700; letter-spacing: 1px; margin-bottom: 6px; }
        p.sub { font-size: 12px; color: #777; margin-bottom: 20px; }
        .field { margin-bottom: 16px; }
        label { display: block; font-size: 11px; font-weight: 600; color: #999; margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.5px; }
        input, textarea, select {
            width: 100%;
            background: rgba(0, 0, 0, 0.45);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 10px;
            padding: 10px 12px;
            color: #fff;
            font-size: 13px;
            outline: none;
            transition: 0.2s;
        }
        input:focus, textarea:focus, select:focus { border-color: #3b82f6; box-shadow: 0 0 10px rgba(59,130,246,0.3); }
        textarea { resize: vertical; min-height: 80px; }
        
        .btn {
            width: 100%;
            padding: 12px;
            background: #2563eb;
            border: none;
            border-radius: 10px;
            color: #fff;
            font-weight: 700;
            font-size: 13px;
            cursor: pointer;
            transition: 0.2s;
            margin-top: 6px;
        }
        .btn:hover { background: #1d4ed8; }
        .btn-refresh { background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.15); margin-bottom: 12px; }
        .btn-refresh:hover { background: rgba(255,255,255,0.15); }
        
        .status { margin-top: 14px; font-size: 12px; text-align: center; display: none; }
        .success { color: #10b981; }
        .error { color: #ef4444; }

        /* 기기 목록 스타일 */
        .device-list { max-height: 480px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
        .device-item {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            padding: 12px 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: 0.2s;
        }
        .device-item:hover { border-color: rgba(255, 255, 255, 0.25); background: rgba(255, 255, 255, 0.07); }
        .device-info .name { font-size: 13px; font-weight: 700; color: #fff; }
        .device-info .code { font-size: 12px; font-family: monospace; color: #60a5fa; font-weight: 800; letter-spacing: 1px; }
        .device-info .time { font-size: 10px; color: #666; margin-top: 2px; }
        .btn-select {
            background: rgba(59, 130, 246, 0.2);
            border: 1px solid rgba(59, 130, 246, 0.4);
            color: #93c5fd;
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
        }
        .btn-select:hover { background: #2563eb; color: #fff; }
    </style>
</head>
<body>

<div class="container">
    <div class="glass-card">
        <h2>INSTALLED DEVICES</h2>
        <p class="sub">앱을 실행한 기기 목록입니다. 선택 시 자동으로 입력됩니다.</p>
        
        <button class="btn btn-refresh" onclick="loadDevices()">기기 목록 새로고침</button>
        <div id="deviceContainer" class="device-list">
            <div style="color: #666; font-size: 12px; text-align: center; padding: 20px;">기기 목록을 불러오는 중...</div>
        </div>
    </div>

    <div class="glass-card">
        <h2>SEND POSTAL MAIL</h2>
        <p class="sub">선택된 기기 또는 전체 사용자에게 우편을 발송합니다.</p>

        <div class="field">
            <label>GitHub Personal Access Token (PAT)</label>
            <input type="password" id="ghToken" placeholder="ghp_xxxxxxxxxxxxxxxxxxxx">
        </div>

        <div class="field">
            <label>GitHub 저장소 (Owner/Repo)</label>
            <input type="text" id="ghRepo" placeholder="아이디/blackmarket-ios">
        </div>

        <div class="field">
            <label>수신 대상</label>
            <select id="targetType" onchange="toggleTargetInput()">
                <option value="ALL">전체 사용자 (ALL)</option>
                <option value="CUSTOM">특정 기기 식별번호 (1:1)</option>
            </select>
        </div>

        <div class="field" id="customTargetField" style="display: none;">
            <label>수신 기기 8자리 코드</label>
            <input type="text" id="targetDeviceId" placeholder="예: 7B2F89A1" maxlength="8">
        </div>

        <div class="field">
            <label>우편 제목</label>
            <input type="text" id="mailTitle" placeholder="우편 제목">
        </div>

        <div class="field">
            <label>우편 본문 내용</label>
            <textarea id="mailContent" placeholder="발송할 메시지 내용..."></textarea>
        </div>

        <button class="btn" onclick="sendMail()">우편 발송하기</button>
        <div id="statusBox" class="status"></div>
    </div>
</div>

<script>
    function toggleTargetInput() {
        const type = document.getElementById('targetType').value;
        document.getElementById('customTargetField').style.display = (type === 'CUSTOM') ? 'block' : 'none';
    }

    function selectDevice(code, name) {
        document.getElementById('targetType').value = 'CUSTOM';
        toggleTargetInput();
        document.getElementById('targetDeviceId').value = code;
        showStatus(`[${name} (${code})] 기기가 선택되었습니다.`, true);
    }

        
        // 기기 목록 불러오기 (CORS 및 master/main 브랜치 문제 완전 해결)
    async function loadDevices() {
        const token = document.getElementById('ghToken').value.trim();
        const repo = document.getElementById('ghRepo').value.trim();
        const container = document.getElementById('deviceContainer');
        
        if (!repo) {
            container.innerHTML = '<div style="color: #ef4444; font-size: 12px; text-align: center; padding: 20px;">먼저 우측(또는 하단)에서 GitHub 저장소(Owner/Repo)를 입력해주세요.</div>';
            return;
        }

        container.innerHTML = '<div style="color: #666; font-size: 12px; text-align: center; padding: 20px;">기기 목록을 불러오는 중...</div>';

        try {
            // GitHub REST API를 통해 mail/devices.json 가져오기 (CORS 에러 없음)
            const headers = { 'Accept': 'application/vnd.github.v3+json' };
            if (token) {
                headers['Authorization'] = `Bearer ${token}`;
            }

            const res = await fetch(`https://api.github.com/repos/${repo}/contents/mail/devices.json?t=` + Date.now(), {
                headers: headers
            });

            if (!res.ok) {
                if (res.status === 404) {
                    throw new Error('mail/devices.json 파일이 저장소에 없습니다. 저장소에 mail/devices.json 파일을 생성했는지 확인해주세요.');
                }
                throw new Error(`불러오기 실패 (상태 코드: ${res.status})`);
            }

            const fileData = await res.json();
            // base64로 인코딩된 파일 내용 디코딩
            const decodedStr = decodeURIComponent(escape(atob(fileData.content.replace(/\n/g, ''))));
            const parsed = JSON.parse(decodedStr);
            const list = parsed.devices || [];

            if (list.length === 0) {
                container.innerHTML = '<div style="color: #888; font-size: 12px; text-align: center; padding: 20px;">등록된 기기가 없습니다.<br>(앱을 한 번 실행해주세요)</div>';
                return;
            }

            container.innerHTML = '';
            list.forEach(d => {
                const item = document.createElement('div');
                item.className = 'device-item';
                item.innerHTML = `
                    <div class="device-info">
                        <div class="name">${d.device_name || 'iPhone'}</div>
                        <div class="code">${d.device_id}</div>
                        <div class="time">최근 접속: ${d.last_seen || '-'}</div>
                    </div>
                    <button class="btn-select" onclick="selectDevice('${d.device_id}', '${d.device_name}')">선택</button>
                `;
                container.appendChild(item);
            });
        } catch (e) {
            container.innerHTML = `<div style="color: #ef4444; font-size: 12px; text-align: center; padding: 20px;">${e.message}</div>`;
        }
    }

    // 우편 발송
    async function sendMail() {
        const token = document.getElementById('ghToken').value.trim();
        const repo = document.getElementById('ghRepo').value.trim();
        const targetType = document.getElementById('targetType').value;
        const targetDeviceId = targetType === 'ALL' ? 'ALL' : document.getElementById('targetDeviceId').value.trim().toUpperCase();
        const title = document.getElementById('mailTitle').value.trim();
        const content = document.getElementById('mailContent').value.trim();

        if (!token || !repo || !title || !content || (targetType === 'CUSTOM' && !targetDeviceId)) {
            showStatus('모든 필드를 올바르게 입력해주세요.', false);
            return;
        }

        showStatus('우편 저장 중...', true);
        const filePath = 'mail/inbox.json';
        const apiURL = `https://api.github.com/repos/${repo}/contents/${filePath}`;

        try {
            const getRes = await fetch(apiURL, {
                headers: { 'Authorization': `Bearer ${token}`, 'Accept': 'application/vnd.github.v3+json' }
            });

            let sha = "";
            let currentMails = [];

            if (getRes.status === 200) {
                const fileData = await getRes.json();
                sha = fileData.sha;
                const decodedContent = decodeURIComponent(escape(atob(fileData.content)));
                currentMails = JSON.parse(decodedContent).mails || [];
            }

            const today = new Date().toISOString().split('T')[0];
            const newMail = {
                id: Date.now(),
                target_device_id: targetDeviceId,
                title: title,
                content: content,
                date: today
            };

            currentMails.unshift(newMail);

            const updatedJson = JSON.stringify({ mails: currentMails }, null, 2);
            const encodedJson = btoa(unescape(encodeURIComponent(updatedJson)));

            const putRes = await fetch(apiURL, {
                method: 'PUT',
                headers: {
                    'Authorization': `Bearer ${token}`,
                    'Accept': 'application/vnd.github.v3+json',
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    message: `[우편 발송] to ${targetDeviceId} - ${title}`,
                    content: encodedJson,
                    sha: sha ? sha : undefined
                })
            });

            if (putRes.ok) {
                showStatus(`우편 발송 완료! (${targetDeviceId})`, true);
                document.getElementById('mailTitle').value = '';
                document.getElementById('mailContent').value = '';
            } else {
                const err = await putRes.json();
                showStatus('발송 실패: ' + (err.message || '권한 오류'), false);
            }
        } catch (e) {
            showStatus('오류: ' + e.message, false);
        }
    }

    function showStatus(text, isOk) {
        const box = document.getElementById('statusBox');
        box.style.display = 'block';
        box.className = 'status ' + (isOk ? 'success' : 'error');
        box.innerText = text;
    }

    window.onload = () => { loadDevices(); };
</script>
</body>
</html>
