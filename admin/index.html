<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Black Market - Skeuomorphic Admin</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif; }
        
        :root {
            --bg-color: #e0e5ec;
            --shadow-light: rgba(255, 255, 255, 0.9);
            --shadow-dark: rgba(163, 177, 198, 0.6);
            --text-main: #334155;
            --text-sub: #64748b;
            --accent: #3b82f6;
        }

        body {
            background: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            padding: 36px 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 1000px;
            display: grid;
            grid-template-columns: 1.15fr 1fr;
            gap: 28px;
        }
        @media (max-width: 860px) { .container { grid-template-columns: 1fr; } }

        /* 뉴모피즘 돌출 카드 */
        .neu-card {
            background: var(--bg-color);
            border-radius: 28px;
            padding: 28px;
            box-shadow: 9px 9px 18px var(--shadow-dark), -9px -9px 18px var(--shadow-light);
            height: fit-content;
        }

        h2 {
            font-size: 19px;
            font-weight: 800;
            letter-spacing: 0.5px;
            color: #1e293b;
            margin-bottom: 6px;
        }
        p.sub {
            font-size: 13px;
            color: var(--text-sub);
            margin-bottom: 20px;
        }

        .field { margin-bottom: 18px; }
        label {
            display: block;
            font-size: 11px;
            font-weight: 700;
            color: #475569;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.8px;
        }

        /* 뉴모피즘 오목한(Inset) 입력창 */
        input[type="text"], textarea, select {
            width: 100%;
            background: var(--bg-color);
            border: none;
            outline: none;
            border-radius: 14px;
            padding: 12px 16px;
            color: var(--text-main);
            font-size: 13px;
            box-shadow: inset 4px 4px 8px var(--shadow-dark), inset -4px -4px 8px var(--shadow-light);
            transition: all 0.2s ease;
        }
        input:focus, textarea:focus, select:focus {
            box-shadow: inset 6px 6px 10px var(--shadow-dark), inset -6px -6px 10px var(--shadow-light);
        }
        textarea { resize: vertical; min-height: 110px; }

        /* 뉴모피즘 돌출 버튼 */
        .neu-btn {
            background: var(--bg-color);
            border: none;
            outline: none;
            border-radius: 14px;
            color: #1e293b;
            font-weight: 700;
            font-size: 13px;
            cursor: pointer;
            box-shadow: 6px 6px 12px var(--shadow-dark), -6px -6px 12px var(--shadow-light);
            transition: all 0.15s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        .neu-btn:hover {
            box-shadow: 4px 4px 8px var(--shadow-dark), -4px -4px 8px var(--shadow-light);
        }
        .neu-btn:active {
            box-shadow: inset 4px 4px 8px var(--shadow-dark), inset -4px -4px 8px var(--shadow-light);
        }

        .btn-primary {
            width: 100%;
            padding: 14px;
            color: #2563eb;
            margin-top: 8px;
        }
        .btn-action {
            padding: 9px 16px;
            font-size: 12px;
        }

        /* 기기 목록 영역 */
        .device-list {
            max-height: 480px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 14px;
            padding: 4px;
        }
        .device-item {
            background: var(--bg-color);
            border-radius: 16px;
            padding: 14px 16px;
            display: flex;
            align-items: center;
            gap: 14px;
            cursor: pointer;
            box-shadow: 5px 5px 10px var(--shadow-dark), -5px -5px 10px var(--shadow-light);
            transition: 0.15s ease;
        }
        .device-item:hover {
            transform: translateY(-1px);
        }
        .device-item.active {
            box-shadow: inset 4px 4px 8px var(--shadow-dark), inset -4px -4px 8px var(--shadow-light);
        }

        .device-item input[type="checkbox"] {
            width: 18px;
            height: 18px;
            accent-color: #2563eb;
            cursor: pointer;
        }
        .device-info { flex: 1; }
        .device-info .name { font-size: 13px; font-weight: 700; color: #1e293b; }
        .device-info .code { font-size: 12px; font-family: monospace; color: #2563eb; font-weight: 800; letter-spacing: 1px; margin-top: 2px; }
        .device-info .time { font-size: 11px; color: #94a3b8; margin-top: 2px; }

        /* 파일 업로드 컴포넌트 */
        .upload-row { display: flex; gap: 12px; align-items: center; }
        .file-label {
            padding: 10px 18px;
            border-radius: 12px;
            cursor: pointer;
        }

        .progress-box {
            display: none;
            margin-top: 12px;
            padding: 12px 14px;
            border-radius: 14px;
            box-shadow: inset 3px 3px 6px var(--shadow-dark), inset -3px -3px 6px var(--shadow-light);
        }
        .progress-header {
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            color: #475569;
            font-family: monospace;
            font-weight: 600;
            margin-bottom: 6px;
        }
        .progress-bar-bg {
            width: 100%;
            height: 8px;
            background: var(--bg-color);
            border-radius: 4px;
            box-shadow: inset 2px 2px 4px var(--shadow-dark), inset -2px -2px 4px var(--shadow-light);
            overflow: hidden;
        }
        .progress-bar-fill {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #3b82f6, #60a5fa);
            border-radius: 4px;
            transition: width 0.1s ease;
        }

        .status { margin-top: 14px; font-size: 13px; text-align: center; display: none; font-weight: 700; }
        .success { color: #059669; }
        .error { color: #e11d48; }
    </style>
</head>
<body>

<div class="container">
    <!-- 좌측 기기 목록 패널 -->
    <div class="neu-card">
        <h2>INSTALLED DEVICES</h2>
        <p class="sub">체크박스를 통해 여러 기기를 선택하여 일괄 발송할 수 있습니다.</p>
        
        <div style="display: flex; gap: 10px;">
            <button class="neu-btn btn-action" onclick="loadDevices()">목록 새로고침</button>
            <button class="neu-btn btn-action" onclick="toggleSelectAll()">전체 선택/해제</button>
        </div>

        <div id="deviceContainer" class="device-list">
            <div style="color: #64748b; font-size: 12px; text-align: center; padding: 25px;">기기 목록을 불러오는 중...</div>
        </div>
    </div>

    <!-- 우측 우편 발송 패널 -->
    <div class="neu-card">
        <h2>SEND POSTAL MAIL</h2>
        <p class="sub">선택된 기기(들) 또는 전체 사용자에게 우편을 발송합니다.</p>

        <div class="field">
            <label>수신 대상 모드</label>
            <select id="targetType" onchange="toggleTargetInput()">
                <option value="SELECTED">좌측 체크된 기기 일괄 발송 (0개 선택됨)</option>
                <option value="ALL">전체 사용자 (ALL)</option>
                <option value="CUSTOM">직접 8자리 코드 입력</option>
            </select>
        </div>

        <div class="field" id="customTargetField" style="display: none;">
            <label>수신 기기 8자리 코드</label>
            <input type="text" id="targetDeviceId" placeholder="예: AC5BAB1F" maxlength="8">
        </div>

        <div class="field">
            <label>우편 제목</label>
            <input type="text" id="mailTitle" placeholder="우편 제목">
        </div>

        <div class="field">
            <label>미디어 첨부 (사진 / GIF / 동영상)</label>
            <div class="upload-row">
                <input type="file" id="mediaInput" accept="image/*,image/gif,video/*" style="display:none" onchange="handleMediaUploadWithProgress()">
                <label for="mediaInput" class="neu-btn file-label">📁 파일 선택 및 업로드</label>
            </div>

            <div id="progressBox" class="progress-box">
                <div class="progress-header">
                    <span id="progressText">0% 업로드 중...</span>
                    <span id="progressBytes">0.0MB / 0.0MB</span>
                </div>
                <div class="progress-bar-bg">
                    <div id="progressBarFill" class="progress-bar-fill"></div>
                </div>
            </div>
        </div>

        <div class="field">
            <label>우편 본문 내용</label>
            <textarea id="mailContent" placeholder="발송할 내용...&#10;버튼 예: [공식몰 이동](https://web.black-market.store)"></textarea>
        </div>

        <button class="neu-btn btn-primary" onclick="sendMail()">우편 일괄 발송하기</button>
        <div id="statusBox" class="status"></div>
    </div>
</div>

<script>
    const SUPABASE_URL = "https://xirtaynusdyvtntlodpz.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhpcnRheW51c2R5dnRudGxvZHB6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg2MTQ5NTUsImV4cCI6MjEwNDE5MDk1NX0.RCiocVn7PZQnWHnyN8tGQ08AV5M5ZbvvIKB6-eQRseI";

    const { createClient } = supabase;
    const db = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let allDevicesList = [];

    function toggleTargetInput() {
        const type = document.getElementById('targetType').value;
        document.getElementById('customTargetField').style.display = (type === 'CUSTOM') ? 'block' : 'none';
    }

    function updateSelectedCount() {
        const checked = document.querySelectorAll('.device-checkbox:checked');
        const selectElem = document.getElementById('targetType');
        selectElem.options[0].text = `좌측 체크된 기기 일괄 발송 (${checked.length}개 선택됨)`;
    }

    function toggleSelectAll() {
        const checkboxes = document.querySelectorAll('.device-checkbox');
        if (checkboxes.length === 0) return;
        const anyUnchecked = Array.from(checkboxes).some(cb => !cb.checked);
        checkboxes.forEach(cb => {
            cb.checked = anyUnchecked;
            cb.closest('.device-item').classList.toggle('active', anyUnchecked);
        });
        updateSelectedCount();
    }

    async function loadDevices() {
        const container = document.getElementById('deviceContainer');
        container.innerHTML = '<div style="color: #64748b; font-size: 12px; text-align: center; padding: 25px;">기기 목록을 확인 중...</div>';

        try {
            const { data, error } = await db.from('devices').select('*').order('last_seen', { ascending: false });
            if (error) throw error;

            allDevicesList = data || [];

            if (allDevicesList.length === 0) {
                container.innerHTML = `
                    <div style="color: #64748b; font-size: 12px; text-align: center; padding: 30px; line-height: 1.6;">
                        <b style="color: #2563eb;">연결 완료</b><br>
                        등록된 기기가 없습니다.<br>
                        앱을 실행하면 자동으로 등록됩니다.
                    </div>`;
                updateSelectedCount();
                return;
            }

            container.innerHTML = '';
            allDevicesList.forEach(d => {
                const item = document.createElement('div');
                item.className = 'device-item';
                item.innerHTML = `
                    <input type="checkbox" class="device-checkbox" value="${d.device_id}" onchange="updateSelectedCount()">
                    <div class="device-info">
                        <div class="name">${d.device_name || 'iPhone'}</div>
                        <div class="code">${d.device_id}</div>
                        <div class="time">최근 접속: ${d.last_seen || '-'}</div>
                    </div>
                `;
                item.addEventListener('click', (e) => {
                    if (e.target.tagName !== 'INPUT') {
                        const cb = item.querySelector('.device-checkbox');
                        cb.checked = !cb.checked;
                        item.classList.toggle('active', cb.checked);
                        updateSelectedCount();
                    }
                });
                container.appendChild(item);
            });
            updateSelectedCount();
        } catch (e) {
            container.innerHTML = `<div style="color: #e11d48; font-size: 12px; text-align: center; padding: 20px;">${e.message || e}</div>`;
        }
    }

    function handleMediaUploadWithProgress() {
        const fileInput = document.getElementById('mediaInput');
        const file = fileInput.files[0];
        if (!file) return;

        const progressBox = document.getElementById('progressBox');
        const progressBarFill = document.getElementById('progressBarFill');
        const progressText = document.getElementById('progressText');
        const progressBytes = document.getElementById('progressBytes');

        progressBox.style.display = 'block';
        progressBarFill.style.width = '0%';
        progressText.style.color = '#334155';
        progressText.innerText = '0% 업로드 중...';

        const fileExt = file.name.split('.').pop();
        const fileName = `${Date.now()}_${Math.random().toString(36).substring(2, 8)}.${fileExt}`;
        const uploadUrl = `${SUPABASE_URL}/storage/v1/object/mail-images/${fileName}`;

        const xhr = new XMLHttpRequest();
        xhr.open('POST', uploadUrl, true);
        xhr.setRequestHeader('apikey', SUPABASE_ANON_KEY);
        xhr.setRequestHeader('Authorization', `Bearer ${SUPABASE_ANON_KEY}`);
        xhr.setRequestHeader('Content-Type', file.type || 'application/octet-stream');
        xhr.setRequestHeader('x-upsert', 'true');

        xhr.upload.onprogress = function (e) {
            if (e.lengthComputable) {
                const percent = Math.round((e.loaded / e.total) * 100);
                const loadedMB = (e.loaded / (1024 * 1024)).toFixed(1);
                const totalMB = (e.total / (1024 * 1024)).toFixed(1);
                progressBarFill.style.width = `${percent}%`;
                progressText.innerText = `${percent}% 업로드 중...`;
                progressBytes.innerText = `${loadedMB}MB / ${totalMB}MB`;
            }
        };

        xhr.onload = function () {
            if (xhr.status >= 200 && xhr.status < 300) {
                progressBarFill.style.width = '100%';
                progressText.style.color = '#059669';
                progressText.innerText = '업로드 완료!';

                const publicUrl = `${SUPABASE_URL}/storage/v1/object/public/mail-images/${fileName}`;
                const contentArea = document.getElementById('mailContent');
                contentArea.value = (contentArea.value ? contentArea.value + '\n' : '') + publicUrl;

                setTimeout(() => {
                    progressBox.style.display = 'none';
                    fileInput.value = '';
                }, 3000);
            } else {
                progressText.style.color = '#e11d48';
                progressText.innerText = '업로드 실패';
            }
        };

        xhr.onerror = function () {
            progressText.style.color = '#e11d48';
            progressText.innerText = '네트워크 오류 발생';
        };

        xhr.send(file);
    }

    async function sendMail() {
        const targetType = document.getElementById('targetType').value;
        const title = document.getElementById('mailTitle').value.trim();
        const content = document.getElementById('mailContent').value.trim();

        if (!title || !content) {
            showStatus('우편 제목과 내용을 모두 입력해주세요.', false);
            return;
        }

        let targetIds = [];
        if (targetType === 'ALL') {
            targetIds = ['ALL'];
        } else if (targetType === 'CUSTOM') {
            const singleId = document.getElementById('targetDeviceId').value.trim().toUpperCase();
            if (!singleId) {
                showStatus('수신 기기 식별코드를 입력해주세요.', false);
                return;
            }
            targetIds = [singleId];
        } else {
            const checkedBoxes = document.querySelectorAll('.device-checkbox:checked');
            if (checkedBoxes.length === 0) {
                showStatus('좌측 목록에서 최소 1대 이상의 기기를 체크해주세요.', false);
                return;
            }
            targetIds = Array.from(checkedBoxes).map(cb => cb.value);
        }

        showStatus(`우편 발송 중... (총 ${targetIds.length}대 대상)`, true);

        const today = new Date().toISOString().split('T')[0];
        const insertRows = targetIds.map(id => ({
            target_device_id: id,
            title: title,
            content: content,
            date: today
        }));

        const { error } = await db.from('inbox').insert(insertRows);

        if (error) {
            showStatus('발송 실패: ' + error.message, false);
        } else {
            showStatus(`총 ${targetIds.length}건의 우편이 성공적으로 발송되었습니다!`, true);
            document.getElementById('mailTitle').value = '';
            document.getElementById('mailContent').value = '';
        }
    }

    function showStatus(text, isOk) {
        const box = document.getElementById('statusBox');
        box.style.display = 'block';
        box.className = 'status ' + (isOk ? 'success' : 'error');
        box.innerText = text;
    }

    window.onload = () => { loadDevices(); };
</script>
</body>
</html>
