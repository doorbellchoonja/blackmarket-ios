<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Black Market - Mail & Device Admin</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace; }
        body { background: #08080a; color: #fff; min-height: 100vh; padding: 30px 20px; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 960px; display: grid; grid-template-columns: 1.1fr 1fr; gap: 24px; }
        @media (max-width: 840px) { .container { grid-template-columns: 1fr; } }
        
        .glass-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border-radius: 20px;
            padding: 26px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
            height: fit-content;
        }
        h2 { font-size: 18px; font-weight: 700; letter-spacing: 1px; margin-bottom: 6px; }
        p.sub { font-size: 12px; color: #777; margin-bottom: 20px; }
        .field { margin-bottom: 16px; }
        label { display: block; font-size: 11px; font-weight: 600; color: #999; margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.5px; }
        input, textarea, select {
            width: 100%;
            background: rgba(0, 0, 0, 0.45);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 10px;
            padding: 10px 12px;
            color: #fff;
            font-size: 13px;
            outline: none;
            transition: 0.2s;
        }
        input:focus, textarea:focus, select:focus { border-color: #3b82f6; box-shadow: 0 0 10px rgba(59,130,246,0.3); }
        textarea { resize: vertical; min-height: 80px; }
        
        .btn {
            width: 100%;
            padding: 12px;
            background: #2563eb;
            border: none;
            border-radius: 10px;
            color: #fff;
            font-weight: 700;
            font-size: 13px;
            cursor: pointer;
            transition: 0.2s;
            margin-top: 6px;
        }
        .btn:hover { background: #1d4ed8; }
        .btn-refresh { background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.15); margin-bottom: 12px; }
        .btn-refresh:hover { background: rgba(255,255,255,0.15); }
        
        .status { margin-top: 14px; font-size: 12px; text-align: center; display: none; }
        .success { color: #10b981; }
        .error { color: #ef4444; }

        .device-list { max-height: 480px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
        .device-item {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            padding: 12px 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: 0.2s;
        }
        .device-item:hover { border-color: rgba(255, 255, 255, 0.25); background: rgba(255, 255, 255, 0.07); }
        .device-info .name { font-size: 13px; font-weight: 700; color: #fff; }
        .device-info .code { font-size: 12px; font-family: monospace; color: #60a5fa; font-weight: 800; letter-spacing: 1px; margin-top: 2px; }
        .device-info .time { font-size: 10px; color: #666; margin-top: 2px; }
        .btn-select {
            background: rgba(59, 130, 246, 0.2);
            border: 1px solid rgba(59, 130, 246, 0.4);
            color: #93c5fd;
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
        }
        .btn-select:hover { background: #2563eb; color: #fff; }
    </style>
</head>
<body>

<div class="container">
    <!-- 좌측: 기기 목록 패널 -->
    <div class="glass-card">
        <h2>INSTALLED DEVICES</h2>
        <p class="sub">GitHub Actions가 관리하는 기기 목록입니다.</p>
        
        <button class="btn btn-refresh" onclick="loadDevices()">기기 목록 새로고침</button>
        <div id="deviceContainer" class="device-list">
            <div style="color: #666; font-size: 12px; text-align: center; padding: 20px;">기기 목록을 불러오는 중...</div>
        </div>
    </div>

    <!-- 우측: 우편 발송 패널 -->
    <div class="glass-card">
        <h2>SEND POSTAL MAIL</h2>
        <p class="sub">GitHub Actions 러너를 트리거하여 우편을 자동 발송합니다.</p>

        <div class="field">
            <label>수신 대상</label>
            <select id="targetType" onchange="toggleTargetInput()">
                <option value="ALL">전체 사용자 (ALL)</option>
                <option value="CUSTOM">특정 기기 식별번호 (1:1)</option>
            </select>
        </div>

        <div class="field" id="customTargetField" style="display: none;">
            <label>수신 기기 8자리 코드</label>
            <input type="text" id="targetDeviceId" placeholder="예: 7B2F89A1" maxlength="8">
        </div>

        <div class="field">
            <label>우편 제목</label>
            <input type="text" id="mailTitle" placeholder="우편 제목">
        </div>

        <div class="field">
            <label>우편 본문 내용</label>
            <textarea id="mailContent" placeholder="발송할 메시지 내용..."></textarea>
        </div>

        <button class="btn" onclick="triggerDispatchMail()">GitHub Actions로 발송하기</button>
        <div id="statusBox" class="status"></div>
    </div>
</div>

<script>
    const REPO = "doorbellchoonja/blackmarket-ios";

    function toggleTargetInput() {
        const type = document.getElementById('targetType').value;
        document.getElementById('customTargetField').style.display = (type === 'CUSTOM') ? 'block' : 'none';
    }

    function selectDevice(code, name) {
        document.getElementById('targetType').value = 'CUSTOM';
        toggleTargetInput();
        document.getElementById('targetDeviceId').value = code;
        showStatus(`[${name} (${code})] 기기가 선택되었습니다.`, true);
    }

    // devices.json 읽기 (CORS 방지 raw 엔드포인트)
    async function loadDevices() {
        const container = document.getElementById('deviceContainer');
        container.innerHTML = '<div style="color: #666; font-size: 12px; text-align: center; padding: 20px;">기기 목록을 확인 중...</div>';

        try {
            const res = await fetch(`https://raw.githubusercontent.com/${REPO}/main/mail/devices.json?t=` + Date.now());
            if (!res.ok) throw new Error('등록된 기기 정보가 아직 없습니다.');

            const data = await res.json();
            const list = data.devices || [];

            if (list.length === 0) {
                container.innerHTML = `
                    <div style="color: #888; font-size: 12px; text-align: center; padding: 25px; line-height: 1.6;">
                        <b style="color: #60a5fa;">Actions 연동 완료</b><br>
                        등록된 기기가 0대입니다.<br>
                        앱을 1회 실행하면 Actions가 실행되며 자동 등록됩니다.
                    </div>`;
                return;
            }

            container.innerHTML = '';
            list.forEach(d => {
                const item = document.createElement('div');
                item.className = 'device-item';
                item.innerHTML = `
                    <div class="device-info">
                        <div class="name">${d.device_name || 'iPhone'}</div>
                        <div class="code">${d.device_id}</div>
                        <div class="time">최근 접속: ${d.last_seen || '-'}</div>
                    </div>
                    <button class="btn-select" onclick="selectDevice('${d.device_id}', '${d.device_name}')">선택</button>
                `;
                container.appendChild(item);
            });
        } catch (e) {
            container.innerHTML = `<div style="color: #ef4444; font-size: 12px; text-align: center; padding: 20px;">${e.message}</div>`;
        }
    }

    // GitHub Actions 실행 (repository_dispatch)
    async function triggerDispatchMail() {
        const targetType = document.getElementById('targetType').value;
        const targetDeviceId = targetType === 'ALL' ? 'ALL' : document.getElementById('targetDeviceId').value.trim().toUpperCase();
        const title = document.getElementById('mailTitle').value.trim();
        const content = document.getElementById('mailContent').value.trim();

        if (!title || !content || (targetType === 'CUSTOM' && !targetDeviceId)) {
            showStatus('모든 필드를 올바르게 입력해주세요.', false);
            return;
        }

        showStatus('GitHub Actions 워크플로 트리거 중...', true);

        try {
            // repository_dispatch 이벤트 발생
            const res = await fetch(`https://api.github.com/repos/${REPO}/dispatches`, {
                method: 'POST',
                headers: {
                    'Accept': 'application/vnd.github.v3+json',
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    event_type: 'send_mail',
                    client_payload: {
                        target_device_id: targetDeviceId,
                        title: title,
                        content: content
                    }
                })
            });

            if (res.status === 204 || res.ok) {
                showStatus(`GitHub Actions 작업이 시작되었습니다! 수초 내 우편함에 등록됩니다.`, true);
                document.getElementById('mailTitle').value = '';
                document.getElementById('mailContent').value = '';
            } else {
                showStatus(`트리거 실패 (HTTP ${res.status}): 저장소 Actions 권한을 확인해주세요.`, false);
            }
        } catch (e) {
            showStatus('오류: ' + e.message, false);
        }
    }

    function showStatus(text, isOk) {
        const box = document.getElementById('statusBox');
        box.style.display = 'block';
        box.className = 'status ' + (isOk ? 'success' : 'error');
        box.innerText = text;
    }

    window.onload = () => { loadDevices(); };
</script>
</body>
</html>
